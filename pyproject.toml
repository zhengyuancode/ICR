[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icr-recovery"
version = "0.1.0"
description = "Interface-closed workflow repair and snapshot-bound relational recovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ICR contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
reproduction = ["numpy>=1.26", "openai>=1", "PyYAML>=6", "requests>=2.31", "httpx>=0.27", "tqdm>=4.66"]

[project.scripts]
icr = "icr.cli:main"

[project.urls]
Repository = "https://github.com/zhengyuancode/ICR"

[tool.setuptools.packages.find]
include = ["icr*"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = ["."]
